name = "businessdiary-api"
main = "src/index.js"
compatibility_date = "2026-01-08"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "businessdiarydb"
database_id = "f18a5ca0-42f3-4854-a359-fb9920f3a44c"

# Cloudflare AI binding for AI Assistant Chat
ai = { binding = "AI" }

# R2 bucket for images (requires R2 to be enabled in Cloudflare Dashboard)
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "businessdiary-images"

# JWT_SECRET should be set via Cloudflare Workers Secrets
# For now, keeping it as var for compatibility
# Run: wrangler secret put JWT_SECRET (then remove this line)
[vars]
JWT_SECRET = "temporary-secret-please-change-via-wrangler-secret-put"
