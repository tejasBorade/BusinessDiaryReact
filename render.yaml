# Render.com Deployment Configuration
# This file defines all services needed for Business Directory

services:
  # Flask Backend API
  - type: web
    name: businessdiary-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: |
      cd backend
      pip install -r requirements.txt
      pip install gunicorn psycopg2-binary
      python recreate_db.py
      python add_categories.py
      python add_subcategories.py
      python populate_data.py
      python assign_businesses_to_subcategories.py
    startCommand: cd backend && gunicorn -w 4 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/categories
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: businessdiary-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
    
  # React Frontend
  - type: web
    name: businessdiary-frontend
    env: static
    branch: main
    buildCommand: |
      cd frontend
      npm install
      npm run build
    staticPublishPath: frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: REACT_APP_API_URL
        value: https://businessdiary-api.onrender.com

databases:
  # PostgreSQL Database
  - name: businessdiary-db
    plan: free
    databaseName: businessdiary
    user: businessdiary_user
    region: oregon
